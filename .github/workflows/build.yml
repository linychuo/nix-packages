name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          nix_path: nixpkgs=nixpkgs/nixos-26.05

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Compare the pinned version with the latest upstream release.
      - name: Check upstream release
        id: check
        run: |
          set -euo pipefail

          latest="$(curl -fsSL https://api.github.com/repos/l0ng-ai/openidea/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')"
          version="${latest#v}"
          current="$(sed -n 's/^  version = "\(.*\)";/\1/p' packages/openidea.nix | head -1)"

          echo "upstream=${latest} (version ${version}), pinned=${current}"

          if [ "$version" = "$current" ]; then
            echo "Already up to date, skipping bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hash="$(nix-prefetch-url --type sha256 \
            "https://github.com/l0ng-ai/openidea/releases/download/${latest}/OpenIDEA_${version}_amd64.deb")"
          sri="$(nix hash convert --to sri --hash-algo sha256 "$hash")"

          sed -i "s/^  version = \".*\";/  version = \"${version}\";/" packages/openidea.nix
          sed -i "s|hash = \"[^\"]*\";|hash = \"${sri}\";|" packages/openidea.nix

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/openidea.nix
          git commit -m "openidea: bump to ${{ steps.check.outputs.version }}"
          git push

      # Manual dispatch always builds (so the first run seeds the cache);
      # scheduled runs only build when a new version was bumped.
      - name: Build and push to Cachix
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#openidea
          cachix push "$CACHIX_CACHE" $(nix path-info -r .#openidea)
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}

      # WindInput is pinned by its own flake, so just (re)build and push it.
      - name: Build and push WindInput to Cachix
        run: |
          nix build .#windinput
          cachix push "$CACHIX_CACHE" $(nix path-info -r .#windinput)
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
